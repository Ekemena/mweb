<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | MWeb IT Solutions</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0f172a;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg), #111827);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
    a {
      display: inline-block;
      text-decoration: none;
      color: #07111f;
      background: var(--accent);
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thank you!</h1>
    <p>Your quote request has been received. We’ll get back to you shortly with the next steps.</p>
    <a href="index.html">Back to home</a>
  </div>
</body>
</html>
